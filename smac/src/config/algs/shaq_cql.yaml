# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 500000 # 500000 for 6h_vs_8z else 100000

# runner: "episode"
runner: "parallel"
batch_size_run: 16 # batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
t_max: 50050000

buffer_size: 5000 
batch_size: 128



# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "n_mac"
agent: "n_rnn"
agent_output_type: q

learner: "shaq_cql_learner"
mixer: "shaq"
mixing_embed_dim: 32
hypernet_embed: 64
hypernet_layers: 2
double_q: True
n_step: 1

lr: 0.001 # Learning rate for agents
td_lambda: 0.6 # 0.3 for 6h_vs_8z else 0.6
q_lambda: False

manual_alpha_estimates: null
# give the sample size for coalition sampling
sample_size: 10
# lr for updating alpha
alpha_lr: 0.001

optimizer: "RMSprop"

# rnn layer normalization
use_layer_norm: False

# orthogonal init for DNN
use_orthogonal: False
gain: 0.01

# Priority experience replay
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False

use_offline: True
use_sarsa: False
cql_alpha: 0.005
global_cql_alpha: 0.05
raw_cql: False
sparse_lambda: False
softmax_temp: 5
training_episodes: 5000
raw_sample_actions: 100
cal_dcql: False


name: "shaq_cql"
